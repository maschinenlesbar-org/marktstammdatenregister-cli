# How the API is accessed: open | key (env: VAR) | account (token, user, password: VARs)
access:
  type: open

de:
  # German version of the README's intro paragraph. Keep it in step with README.md.
  intro: >-
    Ein schlanker **TypeScript-Client mit CLI** für das **Marktstammdatenregister (MaStR)** –
    das Register der Bundesnetzagentur für den deutschen Strom- und Gasmarkt mit rund 9
    Millionen Erzeugungs- und Verbrauchseinheiten (Solar, Wind, Speicher, KWK, …). Nutzt die
    öffentliche „erweiterte öffentliche Einheitensuche“. Eine
    [bund.dev](https://bund.dev)-API.
